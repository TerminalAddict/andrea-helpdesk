name: Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: mbstring, openssl, pdo_mysql, zip

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Build release package
        run: php bin/build-release-package.php

      - name: Read version
        id: version
        run: |
          php -r '$d=json_decode(file_get_contents("version.json"), true); echo "value=".$d["version"].PHP_EOL;' >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Andrea Helpdesk ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            build/andrea-helpdesk-${{ steps.version.outputs.value }}-full.zip
            build/andrea-helpdesk-${{ steps.version.outputs.value }}-full.zip.sha256
