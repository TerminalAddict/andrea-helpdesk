<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea Helpdesk Demo</title>
    <link rel="icon" href="./assets/img/Andrea-Helpdesk-favicon.png">
    <link rel="stylesheet" href="./assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/vendor/quill/quill.snow.css">
    <link rel="stylesheet" href="./assets/css/app.css">
    <link rel="stylesheet" href="./assets/css/terminal-shell.css">
    <link rel="stylesheet" href="./assets/demo.css">
</head>
<body>

<div id="navbar-container"></div>

<div id="app-wrapper" class="terminal-shell-wrap">
    <div id="loading-screen" style="display:none;">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Loading Andrea Helpdesk Demo...</p>
        </div>
    </div>
    <div id="app" class="container-fluid mt-0"></div>
</div>

<button id="scroll-to-top" title="Scroll to top" aria-label="Scroll to top">
    <i class="bi bi-arrow-up"></i>
</button>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:11000;"></div>

<script>
window.DemoConfig = {
    appName: 'Andrea Helpdesk',
    version: '1.3.10-demo'
};
</script>

<script src="./assets/vendor/jquery/jquery.min.js"></script>
<script src="./assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="./assets/demo.js"></script>

</body>
</html>
