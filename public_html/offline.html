<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea Helpdesk Offline</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(39, 226, 198, .22), transparent 32%),
                        linear-gradient(150deg, #f3f6fb, #e7ecf6);
            color: #0f1f31;
        }
        main {
            width: min(92vw, 520px);
            background: rgba(255, 255, 255, .9);
            border: 1px solid rgba(11, 31, 53, .12);
            border-radius: 24px;
            box-shadow: 0 20px 70px rgba(3, 10, 28, .18);
            padding: 2rem;
        }
        img { width: 54px; height: 54px; border-radius: 14px; }
        h1 { margin: 1rem 0 .5rem; font-size: clamp(1.55rem, 4vw, 2.3rem); }
        p { line-height: 1.55; color: #43526a; }
        button {
            min-height: 44px;
            border: 0;
            border-radius: 999px;
            padding: .75rem 1.1rem;
            background: #111b2d;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <img src="/pwa-icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>Andrea Helpdesk needs a network connection for tickets, customers, attachments, and API data. Static app files are cached, but helpdesk data is not cached for security.</p>
    <button onclick="window.location.reload()">Try again</button>
</main>
</body>
</html>
